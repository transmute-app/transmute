# This docker-compose is intended for developers, end-users should use the
# docker-compose in the root of the repository.
services:

  backend:
    container_name: transmute-backend-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend-dev # Makes Dockerfile stop building at the dev build step
    volumes:
      - ./backend:/app/backend
      # - ./data:/app/data # Uncomment this line if you prefer to use a bind mount. WARNING docker runs as root, so files will be owned by root.
      - transmute_backend_dev:/app/data # Comment this line if you are using a bind mount for /app/data, like in the above line (not recommended).
    ports:
      - "3313:3313"
    environment:
      # Allows for python logs to instantly show up in Docker logs
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "/dev/null"
        - "--tries=1"
        - "http://backend:3313/api/health/ready"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: transmute-frontend-dev
    image: node:25-alpine
    working_dir: /app/frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      # lets Vite's file watcher work reliably across bind mounts (esp. macOS/WSL)
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:3313
    command: sh -c "npm ci && npm run dev"

# Comment the volumes block if using a bind mount for backend /app/data
volumes:
  transmute_backend_dev:
    name: transmute_backend_dev # DO NOT RENAME, or else `make clean-docker` and `make clean-all` will break.